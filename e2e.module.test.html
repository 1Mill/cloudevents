<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title></title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="./dist/index.browser.js" type="module"></script>

	<script type="module">
		import { Cloudevent } from './dist/index.browser.js'

		const root = new Cloudevent({
			data: { some: 'payload' },
			source: 'https://github.com/1mill/cloudevents',
			type: 'cmd.do-this-command.v0',
		});

		console.log('root: ', root);

		await new Promise(resolve => setTimeout(resolve, 3000));

		const parent = new Cloudevent({
			data: { isparent: 'yes' },
			parent: root,
			source: 'https://github.com/1mill/cloudevents',
			type: 'cmd.do-this-parent-side-effect.v0',
		});

		console.log('parent: ', parent);

		await new Promise(resolve => setTimeout(resolve, 3000));

		const cloudevent = new Cloudevent({
			actor: 'user#1234',
			data: { new: 'payload', value: true },
			parent,
			source: 'https://www.erikekberg.com/',
			subject: 'project#4321',
			type: 'fct.this-thing-happened.v0',
			wschannelid: 'some-prefix:my-resource-name#id=12345',
		});

		console.log('cloudevent: ', cloudevent);
	</script>
</head>

<body>
	<h1>Hello world!</h1>
	<p>Look at <code>console.log(...)</code> to validate the library is working in this browser environment.</p>
</body>

</html>
